version: 2
updates:

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '00:05'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    assignees:
      - 'baeri_wiliwonka'
    versioning-strategy: 'increase'
    cooldown:
      default-days: 7

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '00:05'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    assignees:
      - 'baeri_wiliwonka'
